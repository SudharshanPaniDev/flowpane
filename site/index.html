<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowpane · Accessible React components for workflow-heavy apps</title>
    <meta
      name="description"
      content="Flowpane is an open-source React component library for admin panels, internal tools, and dashboards: an accessible DataTable, Stepper, Dialog, Tabs, Toast, and more."
    />
    <meta property="og:title" content="Flowpane" />
    <meta property="og:description" content="Accessible React components for workflow-heavy business apps." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem("fp-docs-theme");
          if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-fp-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
